<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Studio</title>
<style>
:root {
  --bg: #0f1117;
  --panel-bg: #171a23;
  --panel-border: #2a2e3a;
  --text: #e7e9ee;
  --text-dim: #9aa0ae;
  --accent: #6c8dff;
  --accent-hover: #8aa4ff;
  --danger: #ff6b6b;
  --danger-hover: #ff8787;
  --canvas-bg: #ffffff;
}

* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.app-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--panel-border);
  background: var(--panel-bg);
}

.app-header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}

.app-body {
  flex: 1;
  display: flex;
  min-height: 0;
}

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.panel h2 {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
}

.tool-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tool-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 6px;
  background: #1e222d;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.tool-btn:hover {
  background: #262b39;
}

.tool-btn.active {
  border-color: var(--accent);
  background: rgba(108, 141, 255, 0.15);
  color: var(--accent-hover);
}

.active-color-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.active-color-swatch {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: 2px solid var(--panel-border);
  background: #1d2b53;
}

.hex-input {
  flex: 1;
  height: 36px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  background: #1e222d;
  color: var(--text);
  padding: 0 10px;
  font-size: 13px;
  font-family: "SFMono-Regular", Consolas, Menlo, monospace;
  text-transform: lowercase;
}

.hex-input:focus {
  outline: none;
  border-color: var(--accent);
}

.sv-wrapper {
  position: relative;
  margin-top: 14px;
  width: 100%;
  aspect-ratio: 220 / 140;
  border-radius: 8px;
  overflow: hidden;
  cursor: crosshair;
  touch-action: none;
}

#sv-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.sv-cursor {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.3);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.hue-range {
  width: 100%;
  margin-top: 12px;
  -webkit-appearance: none;
  appearance: none;
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(
    to right,
    #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%,
    #0000ff 67%, #ff00ff 83%, #ff0000 100%
  );
  cursor: pointer;
}

.hue-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #1a1d26;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
  cursor: pointer;
}

.hue-range::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #1a1d26;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
  cursor: pointer;
}

.hue-range::-moz-range-track {
  height: 12px;
  border-radius: 6px;
  background: transparent;
}

.palette {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}

.palette-swatch {
  aspect-ratio: 1;
  border-radius: 6px;
  border: 2px solid rgba(255, 255, 255, 0.08);
  cursor: pointer;
  position: relative;
  padding: 0;
}

.palette-swatch:hover {
  transform: scale(1.08);
}

.palette-swatch.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.grid-size-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.grid-size-row label {
  font-size: 13px;
  color: var(--text-dim);
}

#grid-size {
  background: #1e222d;
  color: var(--text);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 13px;
}

.symmetry-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
}

.action-buttons {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.action-buttons button {
  padding: 10px;
  background: #1e222d;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}

.action-buttons button:hover {
  background: #262b39;
}

.action-buttons button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.action-buttons button.danger {
  color: var(--danger);
  border-color: rgba(255, 107, 107, 0.3);
}

.action-buttons button.danger:hover {
  background: rgba(255, 107, 107, 0.1);
  border-color: var(--danger-hover);
}

.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 24px;
  min-height: 320px;
  background:
    linear-gradient(45deg, #1a1d26 25%, transparent 25%),
    linear-gradient(-45deg, #1a1d26 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #1a1d26 75%),
    linear-gradient(-45deg, transparent 75%, #1a1d26 75%);
  background-size: 24px 24px;
  background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
}

.canvas-wrapper {
  background: var(--canvas-bg);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  border-radius: 4px;
  line-height: 0;
}

#pixel-canvas {
  display: block;
  image-rendering: pixelated;
  cursor: crosshair;
  touch-action: none;
}

@media (max-width: 720px) {
  .app-body {
    flex-direction: column;
  }
  .canvas-area {
    order: -1;
    flex: none;
    min-height: 60vh;
    min-height: 60dvh;
    padding: 16px;
  }
  .sidebar {
    width: 100%;
    flex: none;
    border-right: none;
    border-bottom: 1px solid var(--panel-border);
    overflow-y: visible;
  }
}
</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🎨 Pixel Art Studio</h1>
    </header>

    <div class="app-body">
      <aside class="sidebar">
        <section class="panel">
          <h2>Outils</h2>
          <div class="tool-buttons">
            <button class="tool-btn active" data-tool="pencil" title="Crayon">✏️ Crayon</button>
            <button class="tool-btn" data-tool="eraser" title="Gomme">🧹 Gomme</button>
            <button class="tool-btn" data-tool="bucket" title="Pot de peinture">🪣 Remplir</button>
            <button class="tool-btn" data-tool="picker" title="Pipette">💧 Pipette</button>
          </div>
        </section>

        <section class="panel">
          <h2>Couleur active</h2>
          <div class="active-color-row">
            <div id="active-color-swatch" class="active-color-swatch"></div>
            <input type="text" id="hex-input" class="hex-input" maxlength="7" value="#1d2b53" spellcheck="false">
          </div>
          <div id="sv-wrapper" class="sv-wrapper">
            <canvas id="sv-canvas" width="220" height="140"></canvas>
            <div id="sv-cursor" class="sv-cursor"></div>
          </div>
          <input type="range" id="hue-range" class="hue-range" min="0" max="359" step="1" value="230">
        </section>

        <section class="panel">
          <h2>Palette</h2>
          <div id="palette" class="palette"></div>
        </section>

        <section class="panel">
          <h2>Grille</h2>
          <div class="grid-size-row">
            <label for="grid-size">Taille</label>
            <select id="grid-size">
              <option value="8">8 × 8</option>
              <option value="16" selected>16 × 16</option>
              <option value="24">24 × 24</option>
              <option value="32">32 × 32</option>
              <option value="48">48 × 48</option>
            </select>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="grid-lines" checked>
            Afficher les lignes de grille
          </label>
        </section>

        <section class="panel">
          <h2>Symétrie</h2>
          <div class="symmetry-options">
            <label class="checkbox-row">
              <input type="checkbox" id="symmetry-h">
              Horizontale (↔)
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="symmetry-v">
              Verticale (↕)
            </label>
          </div>
        </section>

        <section class="panel">
          <h2>Actions</h2>
          <div class="action-buttons">
            <button id="undo-btn" title="Annuler (Ctrl+Z)">↶ Annuler</button>
            <button id="redo-btn" title="Rétablir (Ctrl+Y)">↷ Rétablir</button>
            <button id="clear-btn" class="danger">🗑️ Effacer tout</button>
            <button id="export-btn">⬇️ Exporter PNG</button>
          </div>
        </section>
      </aside>

      <main class="canvas-area">
        <div id="canvas-wrapper" class="canvas-wrapper">
          <canvas id="pixel-canvas"></canvas>
        </div>
      </main>
    </div>
  </div>

  <script>
(() => {
  "use strict";

  const PALETTE = [
    "#000000", "#1d2b53", "#7e2553", "#008751",
    "#ab5236", "#5f574f", "#c2c3c7", "#fff1e8",
    "#ff004d", "#ffa300", "#ffec27", "#00e436",
    "#29adff", "#83769c", "#ff77a8", "#ffccaa",
    "#ffffff", "#c40000", "#e07a00", "#008000",
    "#00468c", "#6a1b9a", "#795548", "#607d8b"
  ];

  const MAX_DISPLAY_PX = 576;
  const MIN_CELL_PX = 6;
  const MAX_HISTORY = 60;

  const canvas = document.getElementById("pixel-canvas");
  const ctx = canvas.getContext("2d");
  const canvasAreaEl = document.querySelector(".canvas-area");
  const paletteEl = document.getElementById("palette");
  const hexInput = document.getElementById("hex-input");
  const activeSwatch = document.getElementById("active-color-swatch");
  const svCanvas = document.getElementById("sv-canvas");
  const svCtx = svCanvas.getContext("2d");
  const svWrapper = document.getElementById("sv-wrapper");
  const svCursor = document.getElementById("sv-cursor");
  const hueRange = document.getElementById("hue-range");
  const gridSizeSelect = document.getElementById("grid-size");
  const gridLinesCheckbox = document.getElementById("grid-lines");
  const symmetryHCheckbox = document.getElementById("symmetry-h");
  const symmetryVCheckbox = document.getElementById("symmetry-v");
  const undoBtn = document.getElementById("undo-btn");
  const redoBtn = document.getElementById("redo-btn");
  const clearBtn = document.getElementById("clear-btn");
  const exportBtn = document.getElementById("export-btn");
  const toolButtons = Array.from(document.querySelectorAll(".tool-btn"));

  const state = {
    gridSize: 16,
    cellSize: 0,
    grid: [],
    tool: "pencil",
    activeColor: "#1d2b53",
    hsv: { h: 230, s: 74, v: 33 },
    isPointerDown: false,
    isSvDragging: false,
    symmetry: { h: false, v: false },
    history: [],
    historyIndex: -1,
  };

  // ---- Color conversions ----
  function hexToRgb(hex) {
    let h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map((c) => c + c).join("");
    const num = parseInt(h, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map((x) => Math.round(x).toString(16).padStart(2, "0")).join("");
  }

  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    const s = max === 0 ? 0 : d / max;
    return { h, s: s * 100, v: max * 100 };
  }

  function hsvToRgb(h, s, v) {
    s /= 100; v /= 100;
    const c = v * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = v - c;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
  }

  function hexToHsv(hex) {
    const { r, g, b } = hexToRgb(hex);
    return rgbToHsv(r, g, b);
  }

  function hsvToHex(h, s, v) {
    const { r, g, b } = hsvToRgb(h, s, v);
    return rgbToHex(r, g, b);
  }

  function makeBlankGrid(size) {
    return new Array(size * size).fill(null);
  }

  function idx(x, y) {
    return y * state.gridSize + x;
  }

  function computeCellSize(size) {
    const areaPadding = 32; // matches .canvas-area horizontal padding (16px * 2)
    const availableWidth = canvasAreaEl.clientWidth - areaPadding;
    const cap = Math.max(MIN_CELL_PX * size, Math.min(MAX_DISPLAY_PX, availableWidth));
    return Math.max(MIN_CELL_PX, Math.floor(cap / size));
  }

  function setupCanvasSize() {
    state.cellSize = computeCellSize(state.gridSize);
    const px = state.cellSize * state.gridSize;
    canvas.width = px;
    canvas.height = px;
    canvas.style.width = px + "px";
    canvas.style.height = px + "px";
  }

  function render() {
    const size = state.gridSize;
    const cs = state.cellSize;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const checkerLight = "#f4f4f4";
    const checkerDark = "#dcdcdc";
    const checkerCell = Math.max(4, Math.floor(cs / 2));

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const color = state.grid[idx(x, y)];
        const px = x * cs;
        const py = y * cs;
        if (color) {
          ctx.fillStyle = color;
          ctx.fillRect(px, py, cs, cs);
        } else {
          for (let cy = 0; cy < cs; cy += checkerCell) {
            for (let cx = 0; cx < cs; cx += checkerCell) {
              const parity = (Math.floor((px + cx) / checkerCell) + Math.floor((py + cy) / checkerCell)) % 2;
              ctx.fillStyle = parity === 0 ? checkerLight : checkerDark;
              ctx.fillRect(px + cx, py + cy, Math.min(checkerCell, cs - cx), Math.min(checkerCell, cs - cy));
            }
          }
        }
      }
    }

    if (gridLinesCheckbox.checked) {
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= size; i++) {
        const pos = i * cs + 0.5;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }
    }

    if (state.symmetry.h || state.symmetry.v) {
      ctx.save();
      ctx.strokeStyle = "rgba(108, 141, 255, 0.7)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      if (state.symmetry.h) {
        const pos = Math.round((size / 2) * cs) + 0.5;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();
      }
      if (state.symmetry.v) {
        const pos = Math.round((size / 2) * cs) + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function getSymmetricCells(x, y) {
    const size = state.gridSize;
    const points = [[x, y]];
    if (state.symmetry.h) points.push([size - 1 - x, y]);
    if (state.symmetry.v) points.push([x, size - 1 - y]);
    if (state.symmetry.h && state.symmetry.v) points.push([size - 1 - x, size - 1 - y]);
    const seen = new Set();
    const result = [];
    for (const [px, py] of points) {
      const key = px + "," + py;
      if (seen.has(key)) continue;
      seen.add(key);
      result.push({ x: px, y: py });
    }
    return result;
  }

  function buildPalette() {
    paletteEl.innerHTML = "";
    PALETTE.forEach((color) => {
      const btn = document.createElement("button");
      btn.className = "palette-swatch";
      btn.style.background = color;
      btn.title = color;
      btn.addEventListener("click", () => setActiveColor(color));
      paletteEl.appendChild(btn);
    });
    syncPaletteSelection();
  }

  function syncPaletteSelection() {
    Array.from(paletteEl.children).forEach((btn) => {
      btn.classList.toggle("selected", btn.style.background === hexToRgbCss(state.activeColor));
    });
  }

  function hexToRgbCss(hex) {
    const el = document.createElement("div");
    el.style.color = hex;
    document.body.appendChild(el);
    const rgb = getComputedStyle(el).color;
    document.body.removeChild(el);
    return rgb;
  }

  function setActiveColor(color, options = {}) {
    const { skipHsvSync = false } = options;
    state.activeColor = color;
    activeSwatch.style.background = color;
    hexInput.value = color;
    syncPaletteSelection();
    if (!skipHsvSync) {
      state.hsv = hexToHsv(color);
    }
    hueRange.value = String(Math.round(state.hsv.h));
    drawSvCanvas(state.hsv.h);
    updateSvCursorPosition();
  }

  function setActiveColorFromHsv(h, s, v) {
    state.hsv = { h, s, v };
    const hex = hsvToHex(h, s, v);
    setActiveColor(hex, { skipHsvSync: true });
  }

  function drawSvCanvas(hue) {
    const w = svCanvas.width;
    const h = svCanvas.height;
    svCtx.fillStyle = hsvToHex(hue, 100, 100);
    svCtx.fillRect(0, 0, w, h);

    const whiteGrad = svCtx.createLinearGradient(0, 0, w, 0);
    whiteGrad.addColorStop(0, "rgba(255,255,255,1)");
    whiteGrad.addColorStop(1, "rgba(255,255,255,0)");
    svCtx.fillStyle = whiteGrad;
    svCtx.fillRect(0, 0, w, h);

    const blackGrad = svCtx.createLinearGradient(0, 0, 0, h);
    blackGrad.addColorStop(0, "rgba(0,0,0,0)");
    blackGrad.addColorStop(1, "rgba(0,0,0,1)");
    svCtx.fillStyle = blackGrad;
    svCtx.fillRect(0, 0, w, h);
  }

  function updateSvCursorPosition() {
    const { s, v } = state.hsv;
    svCursor.style.left = s + "%";
    svCursor.style.top = (100 - v) + "%";
  }

  function pickFromSvEvent(evt) {
    const rect = svWrapper.getBoundingClientRect();
    const x = Math.min(Math.max(evt.clientX - rect.left, 0), rect.width);
    const y = Math.min(Math.max(evt.clientY - rect.top, 0), rect.height);
    const s = (x / rect.width) * 100;
    const v = 100 - (y / rect.height) * 100;
    setActiveColorFromHsv(state.hsv.h, s, v);
  }

  function setTool(tool) {
    state.tool = tool;
    toolButtons.forEach((btn) => btn.classList.toggle("active", btn.dataset.tool === tool));
  }

  function cellFromEvent(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = Math.floor(((evt.clientX - rect.left) * scaleX) / state.cellSize);
    const y = Math.floor(((evt.clientY - rect.top) * scaleY) / state.cellSize);
    if (x < 0 || y < 0 || x >= state.gridSize || y >= state.gridSize) return null;
    return { x, y };
  }

  function paintAt(x, y, colorOverride) {
    const color = colorOverride !== undefined ? colorOverride : (state.tool === "eraser" ? null : state.activeColor);
    const i = idx(x, y);
    if (state.grid[i] === color) return false;
    state.grid[i] = color;
    return true;
  }

  function floodFill(x, y, targetColor, replacementColor) {
    if (targetColor === replacementColor) return;
    const size = state.gridSize;
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cy < 0 || cx >= size || cy >= size) continue;
      const i = idx(cx, cy);
      if (state.grid[i] !== targetColor) continue;
      state.grid[i] = replacementColor;
      stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
    }
  }

  function handlePointerAction(x, y, isStart) {
    if (state.tool === "pencil" || state.tool === "eraser") {
      let changed = false;
      for (const cell of getSymmetricCells(x, y)) {
        changed = paintAt(cell.x, cell.y) || changed;
      }
      if (changed) render();
    } else if (state.tool === "bucket") {
      if (!isStart) return;
      const replacement = state.activeColor;
      for (const cell of getSymmetricCells(x, y)) {
        const target = state.grid[idx(cell.x, cell.y)];
        floodFill(cell.x, cell.y, target, replacement);
      }
      render();
      pushHistory();
    } else if (state.tool === "picker") {
      if (!isStart) return;
      const color = state.grid[idx(x, y)];
      if (color) setActiveColor(color);
    }
  }

  function pushHistory() {
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(state.grid.slice());
    if (state.history.length > MAX_HISTORY) {
      state.history.shift();
    }
    state.historyIndex = state.history.length - 1;
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    undoBtn.disabled = state.historyIndex <= 0;
    redoBtn.disabled = state.historyIndex >= state.history.length - 1;
  }

  function undo() {
    if (state.historyIndex <= 0) return;
    state.historyIndex--;
    state.grid = state.history[state.historyIndex].slice();
    render();
    updateHistoryButtons();
  }

  function redo() {
    if (state.historyIndex >= state.history.length - 1) return;
    state.historyIndex++;
    state.grid = state.history[state.historyIndex].slice();
    render();
    updateHistoryButtons();
  }

  function resetGrid(size, pushToHistory = true) {
    state.gridSize = size;
    state.grid = makeBlankGrid(size);
    setupCanvasSize();
    render();
    if (pushToHistory) {
      state.history = [];
      state.historyIndex = -1;
      pushHistory();
    }
  }

  function exportPNG() {
    const size = state.gridSize;
    const off = document.createElement("canvas");
    off.width = size;
    off.height = size;
    const octx = off.getContext("2d");
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const color = state.grid[idx(x, y)];
        if (color) {
          octx.fillStyle = color;
          octx.fillRect(x, y, 1, 1);
        }
      }
    }
    off.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pixel-art.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, "image/png");
  }

  // Event wiring
  toolButtons.forEach((btn) => {
    btn.addEventListener("click", () => setTool(btn.dataset.tool));
  });

  hueRange.addEventListener("input", (e) => {
    setActiveColorFromHsv(Number(e.target.value), state.hsv.s, state.hsv.v);
  });

  hexInput.addEventListener("change", (e) => {
    const raw = e.target.value.trim();
    const match = /^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.exec(raw);
    if (!match) {
      hexInput.value = state.activeColor;
      return;
    }
    setActiveColor("#" + match[1].toLowerCase().replace(/^([0-9a-f])([0-9a-f])([0-9a-f])$/, "$1$1$2$2$3$3"));
  });

  svWrapper.addEventListener("pointerdown", (e) => {
    state.isSvDragging = true;
    svWrapper.setPointerCapture(e.pointerId);
    pickFromSvEvent(e);
  });

  svWrapper.addEventListener("pointermove", (e) => {
    if (!state.isSvDragging) return;
    pickFromSvEvent(e);
  });

  window.addEventListener("pointerup", () => {
    state.isSvDragging = false;
  });

  gridSizeSelect.addEventListener("change", (e) => {
    const newSize = parseInt(e.target.value, 10);
    const hasContent = state.grid.some((c) => c !== null);
    if (hasContent && !confirm("Changer la taille de la grille effacera le dessin actuel. Continuer ?")) {
      e.target.value = String(state.gridSize);
      return;
    }
    resetGrid(newSize);
  });

  gridLinesCheckbox.addEventListener("change", render);

  symmetryHCheckbox.addEventListener("change", (e) => {
    state.symmetry.h = e.target.checked;
    render();
  });

  symmetryVCheckbox.addEventListener("change", (e) => {
    state.symmetry.v = e.target.checked;
    render();
  });

  clearBtn.addEventListener("click", () => {
    if (state.grid.some((c) => c !== null) && !confirm("Effacer tout le dessin ?")) return;
    state.grid = makeBlankGrid(state.gridSize);
    render();
    pushHistory();
  });

  undoBtn.addEventListener("click", undo);
  redoBtn.addEventListener("click", redo);
  exportBtn.addEventListener("click", exportPNG);

  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key.toLowerCase() === "z" && !e.shiftKey) {
      e.preventDefault();
      undo();
    } else if (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey)) {
      e.preventDefault();
      redo();
    }
  });

  canvas.addEventListener("pointerdown", (e) => {
    const cell = cellFromEvent(e);
    if (!cell) return;
    state.isPointerDown = true;
    canvas.setPointerCapture(e.pointerId);
    handlePointerAction(cell.x, cell.y, true);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!state.isPointerDown) return;
    const cell = cellFromEvent(e);
    if (!cell) return;
    if (state.tool === "pencil" || state.tool === "eraser") {
      handlePointerAction(cell.x, cell.y, false);
    }
  });

  window.addEventListener("pointerup", () => {
    if (!state.isPointerDown) return;
    state.isPointerDown = false;
    if (state.tool === "pencil" || state.tool === "eraser") {
      pushHistory();
    }
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      setupCanvasSize();
      render();
    }, 120);
  });

  // Init
  buildPalette();
  setActiveColor(state.activeColor);
  setTool("pencil");
  resetGrid(state.gridSize);
})();
  </script>
</body>
</html>
