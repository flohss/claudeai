<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi — {{ titre }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-session-id="{{ session_id }}" data-num="{{ num }}">
<a class="retour" href="{{ url_for('accueil') }}">&larr; Retour aux modules</a>
<header>
  <h1>Module {{ num }} — {{ titre }}</h1>
  <p class="parametres">
    {% for nom, valeur in parametres.items() %}
    <span class="tag">{{ nom }} : {{ valeur }}</span>
    {% endfor %}
  </p>
  <p id="statut" class="statut statut-en-cours">Entraînement en cours...</p>
</header>

<section id="section-entrainement">
  <div class="colonne">
    <h2 id="titre-graphique">Courbe d'erreur</h2>
    <canvas id="graphique" width="640" height="280"></canvas>
    <p id="progression"></p>
  </div>
  <div class="colonne">
    <h2>Ce qu'elle pense maintenant</h2>
    <div id="pensees" class="pensees"></div>
    <h3>Historique</h3>
    <div id="historique" class="historique"></div>
  </div>
</section>

<section id="section-demo" hidden>
  <h2>Démonstration : une partie jouée par l'IA</h2>
  <div class="demo">
    <div id="grille" class="grille"></div>
    <p id="demo-info"></p>
  </div>
</section>

<script src="{{ url_for('static', filename='suivi.js') }}"></script>
</body>
</html>
