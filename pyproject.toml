[project]
name = "neura-set"
version = "0.1.0"
description = "NEURA-SET — autonomous AI co-producer for Ableton Live"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "librosa>=0.10",
    "python-osc>=1.9",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "sounddevice>=0.4",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
